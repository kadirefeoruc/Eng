<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hesabım · İngilizce Eğitim</title><link rel="stylesheet" href="/platform/ui.css"><script src="/platform/account.js"></script><script src="/platform/ui.js" defer></script><style>body{margin:0;background:#f4f7fb;font:17px/1.6 system-ui;color:#172b48}header{background:#153f78;color:white;padding:20px}main{max-width:500px;margin:40px auto;padding:28px;background:white;border-radius:18px}label{display:block;margin:16px 0 5px}input,button{font:inherit;padding:12px;box-sizing:border-box;border:1px solid #adc2df;border-radius:9px}input{width:100%}button{cursor:pointer;margin:16px 8px 0 0;background:#15599c;color:white}#message{white-space:pre-wrap}a{color:#15599c}@media(max-width:600px){main{margin:20px;padding:20px}}</style></head><body><header><h1>İngilizce Eğitim</h1></header><main><h2>Üye ol / Giriş yap</h2><p>Öğrendiğin kelimeler ve test ilerlemen hesabına kaydedilir.</p><form id="form"><label for="email">E-posta</label><input id="email" type="email" autocomplete="email" required><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button type="submit">Giriş yap</button><button type="button" id="signup">Yeni üyelik oluştur</button></form><section id="signed" hidden><p id="identity"></p><a href="/home/">Derslere devam et →</a><br><button id="logout">Çıkış yap</button></section><p id="message" role="status"></p><p><a href="/home/">← Anasayfa</a></p></main><script>
const $=id=>document.getElementById(id);if(EngAccount.user){$('form').hidden=true;$('signed').hidden=false;$('identity').textContent=EngAccount.user.email}
async function run(mode){if(!$('form').reportValidity())return;const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);$('message').textContent='İşlem yapılıyor…';try{const message=await EngAccount[mode]($('email').value.trim(),$('password').value);$('message').textContent=message||'Giriş yapılıyor…'}catch(e){$('message').textContent=e.message}finally{buttons.forEach(b=>b.disabled=false)}}$('form').onsubmit=e=>{e.preventDefault();run('signIn')};$('signup').onclick=()=>run('signUp');$('logout').onclick=()=>EngAccount.signOut();
</script></body></html>
